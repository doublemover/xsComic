name: macOS native app

on:
  pull_request:
    branches: [master, port_slopjective_c]
  push:
    branches: [master, port_slopjective_c]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xscomic-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS arm64 app and core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build both app bundles and run core tests in parallel
        shell: bash
        run: |
          mkdir -p build/ci
          verify_bundle() {
            local app="$1"
            plutil -lint "$app/Contents/Info.plist" &&
            test "$(lipo -archs "$app/Contents/MacOS/ComicBookReader")" = arm64 &&
            codesign --verify --deep --strict "$app"
          }

          (
            ./scripts/build-app.sh &&
            verify_bundle build/product/xsComic.app &&
            ditto -c -k --keepParent build/product/xsComic.app build/ci/xsComic-macos-arm64.zip
          ) > build/ci/release.log 2>&1 &
          release=$!
          (
            CBR_SCRATCH_PATH="$PWD/build/clang-debug" CBR_OUTPUT_DIR="$PWD/build/product-debug" \
              ./scripts/build-app.sh --debug &&
            verify_bundle build/product-debug/xsComic.app
          ) > build/ci/debug.log 2>&1 &
          debug=$!
          ./scripts/run-tests.sh > build/ci/core.log 2>&1 &
          core=$!

          status=0
          for pid in "$release" "$debug" "$core"; do
            if ! wait "$pid"; then status=1; fi
          done
          for log in build/ci/*.log; do
            printf '::group::%s\n' "$log"
            cat "$log"
            printf '::endgroup::\n'
          done
          exit "$status"
      - name: Preserve check logs and the verified release bundle
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-evidence
          path: |
            build/ci/*.log
            build/ci/xsComic-macos-arm64.zip
          if-no-files-found: error
